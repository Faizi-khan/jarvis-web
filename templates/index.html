<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family:'Courier New', monospace; }
  #bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
  .ui { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#00eaff; text-align:center; }
  h1 { letter-spacing:6px; text-shadow:0 0 20px #00eaff; margin-bottom:10px; }
  button#micBtn { font-size:20px; padding:18px 36px; border-radius:50px; border:2px solid #00eaff; background:rgba(0,234,255,0.08); color:#00eaff; cursor:pointer; box-shadow:0 0 25px rgba(0,234,255,0.5); transition:all 0.2s; }
  button#micBtn.listening { background:rgba(255,60,60,0.15); border-color:#ff3c3c; color:#ff3c3c; box-shadow:0 0 25px rgba(255,60,60,0.6); }
  #output { margin-top:30px; max-width:600px; font-size:16px; color:#d6faff; min-height:60px; padding:0 20px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="ui">
  <h1>J A R V I S</h1>
  <button id="micBtn">🎤 Tap to talk</button>
  <div id="output"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 6;

  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.6, 1),
    new THREE.MeshBasicMaterial({ color:0x00eaff, wireframe:true, transparent:true, opacity:0.6 })
  );
  scene.add(core);

  const outerRing = new THREE.Mesh(
    new THREE.TorusGeometry(2.4, 0.02, 16, 100),
    new THREE.MeshBasicMaterial({ color:0x00eaff, transparent:true, opacity:0.4 })
  );
  outerRing.rotation.x = Math.PI / 2.2;
  scene.add(outerRing);

  const particleCount = 400;
  const positions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    const r = 4 + Math.random() * 3;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({ color:0x00eaff, size:0.03, transparent:true, opacity:0.7 });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    core.rotation.y += 0.004;
    core.rotation.x += 0.002;
    outerRing.rotation.z += 0.002;
    particles.rotation.y += 0.0008;
    renderer.render(scene, camera);
  }
  animate();
</script>

<script>
  const micBtn = document.getElementById("micBtn");
  const output = document.getElementById("output");

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  async function speak(text) {
    const res = await fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const audioBlob = await res.blob();
    const audioUrl = URL.createObjectURL(audioBlob);
    const audio = new Audio(audioUrl);
    audio.play().catch(err => console.error("Playback blocked:", err));
  }

  micBtn.onclick = () => {
    recognition.start();
    micBtn.classList.add("listening");
    micBtn.textContent = "Listening...";
  };

  recognition.onresult = async (event) => {
    const heard = event.results[0][0].transcript;
    output.innerHTML = "You said: " + heard;
    micBtn.textContent = "Thinking...";

    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: heard }),
    });
    const data = await res.json();

    output.innerHTML += "<br><br>Jarvis: " + data.reply;

    await speak(data.reply);

    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Tap to talk";
  };

  recognition.onerror = () => {
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Tap to talk";
  };
</script>
</body>
</html>
